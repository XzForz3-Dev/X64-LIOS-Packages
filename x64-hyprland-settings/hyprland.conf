# ==============================================================================
# X64 LIOS - Hyprland Classic Configuration Fallback (hyprland.conf)
# ==============================================================================
# NOTA IMPORTANTE PARA PERSONALIZACIÓN Y DOTFILES:
# En Hyprland v0.57+, el motor principal activo es:
#   1. ~/.config/hypr/hyprland.lua  (Configuración base del compositor)
#   2. ~/.config/hypr/custom.lua    (Tus ajustes personales, persistentes al actualizar)
#   3. ~/.config/quickshell/        (Barra superior, Centro de Control y Tema QML)
#
# Si prefieres utilizar dotfiles clásicos basados en hyprland.conf (en lugar de Lua),
# simplemente elimina o renombra ~/.config/hypr/hyprland.lua a hyprland.lua.disabled
# y Hyprland cargará este archivo hyprland.conf automáticamente.
# ==============================================================================

# Monitor configuration (Auto-detect)
monitor=,preferred,auto,auto

# Default Applications
$terminal = kitty
$fileManager = dolphin

# Autostart Core Services, Quickshell & X64 Hello
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = (/usr/lib/hyprpolkitagent/hyprpolkitagent || /usr/lib/polkit-kde-authentication-agent-1) &
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' 2>/dev/null; gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark' 2>/dev/null; gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark' 2>/dev/null &
exec-once = swaybg -i /usr/share/backgrounds/x64-lios/01-monolith.jpg -m fill &
exec-once = QT_QUICK_BACKEND=software quickshell -n &
exec-once = x64-update-tray &
exec-once = x64-hello &
exec-once = x64-hyprland-ctl clipboard start-watch &

# Wayland & Desktop Environment Variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Input Configuration
input {
    kb_layout = us,es
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# Window Decorations & X64 Crimson Aesthetics
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ff2b2bee) rgba(ff4d4dee) 45deg
    col.inactive_border = rgba(1a1a1aaa)

    layout = dwindle
    allow_tearing = true
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 2
    }

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(00000088)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 5, easeOutQuint
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, easeOutQuint, fade
    animation = specialWorkspace, 1, 5, easeOutQuint, slidefadevert -35%
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}

# Keybindings
$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, exec, quickshell ipc call menu toggle
bind = $mainMod, D, exec, quickshell ipc call menu toggle
bind = $mainMod, C, exec, quickshell ipc call control toggle
bind = $mainMod CTRL, N, exec, quickshell ipc call network toggle
bind = $mainMod, L, exec, quickshell ipc call lock lock
bind = $mainMod, V, exec, quickshell ipc call clipboard toggle
bind = $mainMod, W, togglefloating,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, S, exec, x64-hyprland-ctl scratchpad
bind = $mainMod, A, exec, x64-hyprland-ctl scratchpad
bind = $mainMod, G, exec, x64-hyprland-ctl gamemode toggle
bind = $mainMod, F1, exec, quickshell ipc call shortcuts toggle
bind = $mainMod, B, exec, kitty --title Btop -e btop
bind = $mainMod, H, exec, x64-hello
bind = $mainMod, Tab, exec, quickshell ipc call overview toggle
bind = ALT, Tab, cyclenext

# Multimedia, Brightness, Screenshots & Screen Recording
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, x64-hyprland-ctl brightness up
bindel = , XF86MonBrightnessDown, exec, x64-hyprland-ctl brightness down
bind   = , Print, exec, x64-hyprland-ctl screenshot full
bind   = $mainMod SHIFT, S, exec, x64-hyprland-ctl screenshot region
bind   = $mainMod SHIFT, R, exec, x64-hyprland-ctl record toggle

# Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window position
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces 1..10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll workspace with mouse wheel (works on empty workspaces too)
bind = $mainMod, mouse_down, workspace, r+1
bind = $mainMod, mouse_up, workspace, r-1

# Live Cinematic Magnifier / Zoom (On/Off in Control Center + SUPER + CTRL + Wheel)
bind = $mainMod CTRL, mouse_down, exec, x64-hyprland-ctl zoom in
bind = $mainMod CTRL, mouse_up, exec, x64-hyprland-ctl zoom out
bind = $mainMod CTRL, mouse:274, exec, x64-hyprland-ctl zoom reset
bind = $mainMod CTRL, 0, exec, x64-hyprland-ctl zoom reset
bind = $mainMod CTRL, equal, exec, x64-hyprland-ctl zoom in
bind = $mainMod CTRL, minus, exec, x64-hyprland-ctl zoom out

# Move/Resize with Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hybrid Pro-Gaming: Automatic Immediate Tearing for Steam / Proton / Wine / Launchers
windowrulev2 = immediate, class:^(steam_app_.*|gamescope|cs2|dota2|heroic|lutris|osu!|retroarch|wine|Proton).*
