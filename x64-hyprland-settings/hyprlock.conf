# =============================================================================
# X64 LIOS - Official Hyprlock Security Screen Configuration (v0.9.7+)
# Aesthetic: Obsidian Glass & Neon Crimson (#ff2b2b)
# =============================================================================

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = /usr/share/backgrounds/x64-lios/01-monolith.jpg
    color = rgba(0b0b10ff)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.92
    brightness = 0.62
    vibrancy = 0.18
}

# Top Identity Badge
label {
    monitor =
    text = 󰣇  X64 LIOS  •  SESIÓN PROTEGIDA
    color = rgba(ff2b2bee)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 210
    halign = center
    valign = center
}

# Giant Digital Clock
label {
    monitor =
    text = $TIME
    color = rgba(f8f8faff)
    font_size = 76
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 125
    halign = center
    valign = center
}

# Current User Subtitle
label {
    monitor =
    text = 󰌾   Operador: $USER
    color = rgba(a6adc8ee)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 310, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(ff2b2bee)
    inner_color = rgba(0b0b10f5)
    font_color = rgb(245, 245, 250)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Introduce tu contraseña...</i>
    hide_input = false
    rounding = 12
    check_color = rgba(10b981ee)
    fail_color = rgba(ff2b2bff)
    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i>
    capslock_color = rgba(ffaa00ee)
    position = 0, -40
    halign = center
    valign = center
}

