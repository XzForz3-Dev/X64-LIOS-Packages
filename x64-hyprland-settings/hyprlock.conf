# =============================================================================
# X64 LIOS - Official Hyprlock Security Screen Configuration (v0.9.7+)
# Dynamic Palette & Wallpaper synced automatically via x64-theme
# =============================================================================

$x64_bg = /usr/share/backgrounds/x64-lios/01-monolith.jpg
$x64_bg_color = rgba(0b0c10ff)
$x64_surface = rgba(13151cf5)
$x64_accent = rgba(ff2b2bee)
$x64_accent_solid = rgba(ff2b2bff)
$x64_fg = rgba(ebe8e3ff)
$x64_fg_rgb = rgb(235, 232, 227)
$x64_fg_muted = rgba(8e909aee)
$x64_ok = rgba(34d399ee)
$x64_warn = rgba(f5a524ee)

# Live theme overrides generated by x64-theme (colors + active wallpaper/poster)
source = ~/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = $x64_bg
    color = $x64_bg_color
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.92
    brightness = 0.62
    vibrancy = 0.18
}

# Top Identity Badge
label {
    monitor =
    text = 󰣇  X64 LIOS  •  SESIÓN PROTEGIDA
    color = $x64_accent
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 210
    halign = center
    valign = center
}

# Giant Digital Clock
label {
    monitor =
    text = $TIME
    color = $x64_fg
    font_size = 76
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 125
    halign = center
    valign = center
}

# Current User Subtitle
label {
    monitor =
    text = 󰌾   Operador: $USER
    color = $x64_fg_muted
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 310, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.22
    dots_center = true
    outer_color = $x64_accent
    inner_color = $x64_surface
    font_color = $x64_fg_rgb
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Introduce tu contraseña...</i>
    hide_input = false
    rounding = 12
    check_color = $x64_ok
    fail_color = $x64_accent_solid
    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i>
    capslock_color = $x64_warn
    position = 0, -40
    halign = center
    valign = center
}

