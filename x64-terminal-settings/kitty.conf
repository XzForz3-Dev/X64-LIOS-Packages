# ============================================================
#  X64 LIOS - Kitty Terminal Theme & Settings
# ============================================================

# --- Shell ---
shell /usr/bin/fish

# --- Fonts ---
font_family      JetBrainsMono Nerd Font Regular
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0

# --- Window ---
window_padding_width 12
hide_window_decorations no
confirm_os_window_close 0
remember_window_size no
initial_window_width 110c
initial_window_height 30c

# --- Colors (X64 Hacker Red/Black) ---
foreground            #c0c0c0
background            #08080a
background_opacity    0.96
selection_foreground  #ffffff
selection_background  #ff2b2b

cursor                #ff2b2b
cursor_text_color     #ffffff

# Black
color0  #1c1c1c
color8  #4d4d4d
# Red
color1  #ff2b2b
color9  #ff4d4d
# Green
color2  #40e0d0
color10 #40e0d0
# Yellow
color3  #f5c211
color11 #f5c211
# Blue
color4  #1e90ff
color12 #1e90ff
# Magenta
color5  #ff00ff
color13 #ff00ff
# Cyan
color6  #00ffff
color14 #00ffff
# White
color7  #a8a8a8
color15 #ffffff

