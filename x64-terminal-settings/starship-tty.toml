format = """
$username \
$directory \
$character"""

[username]
show_always = true
style_user = "bg:red fg:white bold"
style_root = "bg:red fg:white bold"
format = "[\\[X64 LIOS\\]]($style)"

[directory]
style = "bg:bright-black fg:white bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[character]
success_symbol = "[> ](bold red)"
error_symbol = "[x ](bold red)"
