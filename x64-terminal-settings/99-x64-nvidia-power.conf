# X64 LIOS - Nvidia DRM & Power Management Configuration
# Fixes black screen on wake up / DPMS / resume in Wayland and prevents nvidia_uvm NULL pointer dereference on S3 suspend
options nvidia-drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=0 NVreg_TemporaryFilePath=/var/tmp
