# ==============================================================================
# X64 LIOS Linux - sched_ext (scx_loader) Low-Latency Gaming Profile
# Protected via Pacman backup=() so user selections from X64 Hello persist.
# Scheduler mode flags are managed natively by scx_loader so scx-scheds updates
# never break flag compatibility across scx_lavd, scx_bpfland, scx_cosmos,
# scx_flash, or scx_rusty.
# ==============================================================================
default_sched = "scx_lavd"
default_mode = "Gaming"
