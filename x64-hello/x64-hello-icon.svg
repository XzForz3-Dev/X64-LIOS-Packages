<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Red Card Body -->
    <rect x="29" y="15" width="92" height="100" rx="8" ry="8" fill="#cc0000"/>

    <!-- Diagonal Arrow Shadow (Pure Geometry, No clipPath required) -->
    <polygon points="83,30 121,68 121,90 82,90 74.5,82.5 97,60 83,60" fill="#a30000"/>

    <!-- White Arrow -->
    <path d="M66,30 H83 V60 H97 L74.5,82.5 L52,60 H66 Z" fill="#ffffff"/>

    <!-- Dark Bottom Base -->
    <rect x="15" y="90" width="120" height="44" rx="8" ry="8" fill="#161616"/>

    <!-- Inactive Bar (Node 2 to Node 3) -->
    <rect x="74" y="109" width="37" height="6" rx="3" ry="3" fill="#383838"/>

    <!-- Active Bar (Node 1 to Node 2) -->
    <rect x="38" y="109" width="37" height="6" rx="3" ry="3" fill="#ff1c1c"/>

    <!-- Node 3 (Inactive Dark Grey) -->
    <circle cx="111" cy="112" r="8.5" fill="#454545"/>

    <!-- Node 1 (Active Crimson Red) -->
    <circle cx="38" cy="112" r="9" fill="#ff1c1c"/>

    <!-- Node 2 (Active Crimson Red) -->
    <circle cx="74" cy="112" r="9" fill="#ff1c1c"/>
  </g>
</svg>
