name: X64 LIOS Packages CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment & SSH
        run: |
          # Configurar repositorio propio x64-lios para resolver dependencias existentes
          echo -e "\n[x64-lios]\nSigLevel = Optional TrustAll\nServer = https://repo.x64lios.com/\$arch\n" >> /etc/pacman.conf
          pacman -Syu --noconfirm rsync openssh git sudo
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > $HOME/.ssh/deploy_key
          chmod 600 $HOME/.ssh/deploy_key
          ssh-keyscan -H 169.58.73.67 >> ~/.ssh/known_hosts
          
          # Crear usuario sin privilegios para makepkg
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Download Current Repo Database
        run: |
          echo "Descargando base de datos actual del VPS para no sobrescribir paquetes antiguos..."
          rsync -avz -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no" root@169.58.73.67:/var/www/x64-repo/x86_64/x64-lios.db.tar.gz ./ || echo "No DB found. Creating a new one."
          chown builder:builder x64-lios.db.tar.gz || true

      - name: Build Packages (makepkg)
        run: |
          su builder -c "
            mkdir -p build_output
            shopt -s nullglob
            # Orden de compilación para respetar dependencias locales (falcond-profiles antes de falcond)
            BUILD_QUEUE=(falcond-profiles falcond x64-calamares x64-theme-live x64-welcome)
            for dir in \"\${BUILD_QUEUE[@]}\"; do
              if [ -d \"\$dir\" ] && [ -f \"\$dir/PKGBUILD\" ]; then
                echo \"Compilando paquete en \$dir...\"
                cd \"\$dir\"
                makepkg -s --noconfirm
                mv *.pkg.tar.zst ../build_output/ 2>/dev/null || true
                cd ..
                # Instalar inmediatamente paquetes locales recién construidos para satisfacer dependencias de paquetes posteriores
                pkgs=(build_output/*.pkg.tar.zst)
                if [ \${#pkgs[@]} -gt 0 ]; then
                  sudo pacman -U --needed --noconfirm \"\${pkgs[@]}\" 2>/dev/null || true
                fi
              fi
            done

            # Escaneo dinámico para cualquier otro paquete adicional que se agregue en el futuro
            for dir in */ ; do
              dir=\"\${dir%/}\"
              if [[ ! \" \${BUILD_QUEUE[*]} \" =~ \" \${dir} \" ]] && [ \"\$dir\" != \"build_output\" ] && [ -f \"\$dir/PKGBUILD\" ]; then
                echo \"Compilando paquete adicional en \$dir...\"
                cd \"\$dir\"
                makepkg -s --noconfirm
                mv *.pkg.tar.zst ../build_output/ 2>/dev/null || true
                cd ..
                pkgs=(build_output/*.pkg.tar.zst)
                if [ \${#pkgs[@]} -gt 0 ]; then
                  sudo pacman -U --needed --noconfirm \"\${pkgs[@]}\" 2>/dev/null || true
                fi
              fi
            done
          "

      - name: Update Pacman Database (repo-add)
        run: |
          su builder -c "
            shopt -s nullglob
            pkgs=(build_output/*.pkg.tar.zst)
            if [ \${#pkgs[@]} -gt 0 ]; then
              echo \"Registrando nuevos paquetes en la base de datos...\"
              cp x64-lios.db.tar.gz build_output/ 2>/dev/null || true
              cd build_output
              repo-add x64-lios.db.tar.gz *.pkg.tar.zst
            else
              echo \"No se compilaron paquetes nuevos.\"
            fi
          "

      - name: Deploy to VPS Production
        run: |
          shopt -s nullglob
          pkgs=(build_output/*.pkg.tar.zst)
          if [ ${#pkgs[@]} -gt 0 ]; then
            echo "Limpiando versiones viejas en el VPS antes de desplegar..."
            for pkg in "${pkgs[@]}"; do
              pkgname=$(pacman -Qp "$pkg" | awk '{print $1}')
              if [ -n "$pkgname" ]; then
                echo "Borrando versiones antiguas de $pkgname..."
                ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no root@169.58.73.67 "rm -f /var/www/x64-repo/x86_64/${pkgname}-*.pkg.tar.zst"
              fi
            done
            echo "Desplegando paquetes nuevos y base de datos actualizada al VPS Contabo..."
            rsync -avz -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no" build_output/*.pkg.tar.zst build_output/x64-lios.db* build_output/x64-lios.files* root@169.58.73.67:/var/www/x64-repo/x86_64/
          else
            echo "Nada que desplegar."
          fi
